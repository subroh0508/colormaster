openapi: 3.1.0
info:
  title: colormaster-api
  version: 0.0.0-skeleton
  description: |
    ColorMaster Backend API (skeleton). 本格定義は C5 (EPIC-003) で実装。
    認証は GIS ID Token (Bearer) 必須 (/api/me/*)、/api/idols/* は公開マスタ。
servers:
  - url: https://colormaster-api.example.com
    description: 本番 (Cloud Run、C7 でデプロイ予定)
  - url: http://localhost:8080
    description: ローカル開発
paths:
  /api/idols:
    get:
      summary: アイドル一覧取得 (公開、骨格)
      operationId: listIdols
      responses:
        '200':
          description: アイドル一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  idols:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
  /api/me/favorites:
    get:
      summary: ユーザーの担当・推し一覧取得 (要認証、骨格)
      operationId: listMyFavorites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 担当一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      type: object
                      properties:
                        idolId:
                          type: string
                        addedAt:
                          type: string
                          format: date-time
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: GIS ID Token (Backend で JWKS 検証して sub 抽出)
